[project]
name = "exception-triage"
version = "0.1.0"
description = "Exception triage for accounts payable"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["triage", "evals", "callqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
